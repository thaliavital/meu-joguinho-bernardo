<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números - Bernardo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        h1 {
            font-size: 38px;
            color: #333;
        }

        #pergunta {
            font-size: 32px;
            font-weight: bold;
            margin: 40px 0;
        }

        .opcoes {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .numero {
            width: 180px;
            height: 180px;
            font-size: 90px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            background: white;
            box-shadow: 0 5px 12px rgba(0,0,0,0.2);
            cursor: pointer;
        }

        .numero:active {
            transform: scale(0.95);
        }

        #mensagem {
            font-size: 28px;
            font-weight: bold;
            margin-top: 35px;
            min-height: 40px;
        }

        #acertos {
            font-size: 22px;
            margin-top: 20px;
        }

        .voltar {
            margin-top: 35px;
            padding: 15px 25px;
            font-size: 20px;
            border: none;
            border-radius: 15px;
            background: #ddd;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>🔢 Números</h1>

    <div id="pergunta">Onde está o número 5?</div>

    <div class="opcoes">
        <button class="numero" id="opcao1" onclick="escolher(1)"></button>
        <button class="numero" id="opcao2" onclick="escolher(2)"></button>
    </div>

    <div id="mensagem"></div>

    <div id="acertos">Acertos: 0</div>

    <button class="voltar" onclick="voltar()">🏠 Voltar</button>

    <script>
        let numeroCorreto;
        let acertos = 0;

        function novaPergunta() {

            numeroCorreto = Math.floor(Math.random() * 10) + 1;

            let numeroErrado;

            do {
                numeroErrado = Math.floor(Math.random() * 10) + 1;
            } while (numeroErrado === numeroCorreto);

            document.getElementById("pergunta").innerHTML =
                "Onde está o número " + numeroCorreto + "?";

            let corretaNaEsquerda = Math.random() < 0.5;

            if (corretaNaEsquerda) {
                document.getElementById("opcao1").innerHTML = numeroCorreto;
                document.getElementById("opcao2").innerHTML = numeroErrado;
            } else {
                document.getElementById("opcao1").innerHTML = numeroErrado;
                document.getElementById("opcao2").innerHTML = numeroCorreto;
            }

            document.getElementById("mensagem").innerHTML = "";
        }

        function escolher(opcao) {

            let valorEscolhido =
                Number(document.getElementById("opcao" + opcao).innerHTML);

            if (valorEscolhido === numeroCorreto) {

                acertos++;

                document.getElementById("mensagem").innerHTML =
                    "⭐ Muito bem, Bernardo! ⭐";

                document.getElementById("acertos").innerHTML =
                    "Acertos: " + acertos;

                setTimeout(novaPergunta, 1000);

            } else {

                document.getElementById("mensagem").innerHTML =
                    "💛 Vamos tentar outra vez!";
            }
        }

        function voltar() {
            window.location.href = "../index.html";
        }

        novaPergunta();
    </script>

</body>
</html>
